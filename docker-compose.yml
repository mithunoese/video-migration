# Video Migration Platform — Docker Compose (Neon DB edition)
#
# Database: Neon (external) — set POSTGRES_URL in your .env
# S3:       LocalStack (local mock, no AWS account needed)
#
# Usage:
#   cp .env.example .env       # fill in Kaltura, Zoom, and POSTGRES_URL (Neon)
#   docker compose up -d       # starts dashboard + localstack + bucket init
#   docker compose logs -f     # follow logs
#   open http://localhost:8000

services:
  localstack:
    image: localstack/localstack:latest
    container_name: video-migration-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - DEBUG=0
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    restart: unless-stopped

  init-aws:
    image: amazon/aws-cli
    container_name: video-migration-init-aws
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      sh -c "
        aws --endpoint-url=http://localstack:4566 s3 mb s3://migration-staging --region us-east-1 2>/dev/null || true;
        echo 'Bucket ready: s3://migration-staging'
      "
    restart: "no"

  dashboard:
    build: .
    container_name: video-migration-dashboard
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"
    env_file: .env
    environment:
      - STATE_DIR=/app/data
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      # Neon DB — set POSTGRES_URL in your .env
      - POSTGRES_URL=${POSTGRES_URL:-}
      # Queue migrations to DB so the worker container runs them
      - QUEUE_MIGRATIONS=1
    volumes:
      - migration_data:/app/data
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    build: .
    container_name: video-migration-worker
    command: ["python", "worker/worker.py"]
    env_file: .env
    environment:
      - POSTGRES_URL=${POSTGRES_URL:-}
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - DOWNLOAD_DIR=/tmp/video-migration
      - WORKER_POLL_INTERVAL=5
    volumes:
      - migration_data:/app/data
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

volumes:
  migration_data:
    driver: local
  localstack_data:
    driver: local
