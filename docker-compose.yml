# Video Migration Platform — Docker Compose
#
# Architecture:
#   Vercel (Dashboard UI + API) — queues migration jobs to Neon DB
#   Docker (Worker + MinIO S3)  — worker polls DB, downloads from Kaltura, stages to MinIO, uploads to Zoom
#
# Usage:
#   docker compose up -d          # start MinIO + worker
#   open http://localhost:9001     # MinIO console (minioadmin / minioadmin)
#   S3 endpoint: http://localhost:9000
#
# Prerequisites:
#   cp .env.example .env
#   # Fill in POSTGRES_URL, KALTURA_*, ZOOM_*
#   # Leave AWS_* blank — worker uses MinIO credentials below

services:
  minio:
    image: minio/minio:latest
    container_name: video-migration-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped

  init-bucket:
    image: minio/mc:latest
    container_name: video-migration-init-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb local/migration-staging --ignore-existing;
        echo 'Bucket ready: s3://migration-staging'
      "
    restart: "no"

  worker:
    build: .
    container_name: video-migration-worker
    command: ["python", "worker/worker.py"]
    env_file:
      - .env
    environment:
      # MinIO S3 — overrides any .env AWS settings
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-migration-staging}
      # Worker config
      - WORKER_POLL_INTERVAL=5
      - DOWNLOAD_DIR=/tmp/video-migration
    depends_on:
      minio:
        condition: service_healthy
      init-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  minio_data:
    driver: local
